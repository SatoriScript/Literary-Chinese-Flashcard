<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddhist Chinese Flashcards & Tracing</title>
    <!-- Load HanziWriter library for stroke order and tracing -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }
        /* Left Pane: Flashcard */
        .left-pane, .right-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #666; }
        
        .scene {
            width: 300px;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card.is-flipped { transform: rotateY(180deg); }
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: white;
            border: 2px solid #e1e4e8;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card__face--front { font-size: 5rem; font-weight: bold; }
        .card__face--back { transform: rotateY(180deg); }
        .pinyin { font-size: 2rem; color: var(--primary); margin-bottom: 15px; }
        .meaning { font-size: 1.2rem; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #357abd; }
        button:active { transform: scale(0.98); }

        /* Right Pane: Tracing */
        #character-target {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 200px;
            align-items: center;
        }
        .writer-box {
            border: 2px dashed #ccc;
            border-radius: 8px;
            background: #fff;
            /* Prevents scrolling while tracing on mobile */
            touch-action: none; 
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .scene { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left Pane -->
    <div class="left-pane">
        <h2>Vocabulary</h2>
        <div class="scene" id="scene">
            <div class="card" id="card">
                <div class="card__face card__face--front" id="card-front"></div>
                <div class="card__face card__face--back">
                    <div class="pinyin" id="card-pinyin"></div>
                    <div class="meaning" id="card-meaning"></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="prevCard()">&#8592; Prev</button>
            <button onclick="flipCard()">Flip</button>
            <button onclick="nextCard()">Next &#8594;</button>
        </div>
    </div>

    <!-- Right Pane -->
    <div class="right-pane">
        <h2>Stroke Order & Tracing</h2>
        <div id="character-target"></div>
        <div class="controls">
            <button onclick="animateStrokes()">Animate</button>
            <button onclick="startQuiz()">Trace!</button>
        </div>
        <p style="font-size: 0.85rem; color: #888; text-align: center;">
            Click <strong>Animate</strong> to watch. Click <strong>Trace!</strong> to practice drawing with your mouse or finger.
        </p>
    </div>
</div>

<script>
    // Vocabulary Data
    const vocab = [
        { char: "始", pinyin: "shǐ", meaning: "the beginning; to begin" },
        { char: "終", pinyin: "zhōng", meaning: "the end; to be finished; to die" },
        { char: "強", pinyin: "qiǎng", meaning: "to force; with difficulty" },
        { char: "法", pinyin: "fǎ", meaning: "Dharma, law, method" },
        { char: "從", pinyin: "cóng", meaning: "from; to follow (Ablative case marker)" },
        { char: "悟", pinyin: "wù", meaning: "to understand (all of a sudden); awaken" },
        { char: "色", pinyin: "sè", meaning: "form, matter; color (Sanskrit: rūpa)" },
        { char: "覺", pinyin: "jué", meaning: "to wake up, be aware of; enlightened" },
        { char: "為", pinyin: "wéi", meaning: "to be, to become (Copula verb)" }
    ];

    let currentIndex = 0;
    const card = document.getElementById('card');
    let writers = []; // Stores HanziWriter instances

    function updateCard() {
        // Reset flip state
        card.classList.remove('is-flipped');
        
        // Update text
        setTimeout(() => {
            document.getElementById('card-front').innerText = vocab[currentIndex].char;
            document.getElementById('card-pinyin').innerText = vocab[currentIndex].pinyin;
            document.getElementById('card-meaning').innerText = vocab[currentIndex].meaning;
            
            // Render tracing characters
            renderWriters(vocab[currentIndex].char);
        }, 150);
    }

    function renderWriters(word) {
        const target = document.getElementById('character-target');
        target.innerHTML = ''; // Clear previous
        writers = [];

        // Support multi-character words by looping through them
        for (let i = 0; i < word.length; i++) {
            let div = document.createElement('div');
            div.className = 'writer-box';
            target.appendChild(div);

            let writer = HanziWriter.create(div, word[i], {
                width: 180,
                height: 180,
                padding: 10,
                showOutline: true,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 100,
                radicalColor: '#168F16' // Highlights the radical in green
            });
            writers.push(writer);
        }
    }

    // Flashcard Controls
    function flipCard() { card.classList.toggle('is-flipped'); }
    function nextCard() { currentIndex = (currentIndex + 1) % vocab.length; updateCard(); }
    function prevCard() { currentIndex = (currentIndex - 1 + vocab.length) % vocab.length; updateCard(); }
    document.getElementById('scene').addEventListener('click', flipCard);

    // Tracing Controls
    function animateStrokes() {
        writers.forEach(writer => {
            writer.cancelQuiz();
            writer.animateCharacter();
        });
    }
    
    function startQuiz() {
        writers.forEach(writer => {
            writer.quiz({
                onMistake: function(strokeData) {
                    console.log('Mistake on stroke', strokeData.strokeNum);
                },
                onComplete: function(summaryData) {
                    console.log('Character finished!');
                }
            });
        });
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); flipCard(); }
        else if (e.code === 'ArrowRight') { nextCard(); }
        else if (e.code === 'ArrowLeft') { prevCard(); }
    });

    // Init
    updateCard();
</script>

</body>
</html>
